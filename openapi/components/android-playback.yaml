AndroidPlaybackCreateRequest:
  type: object
  properties:
    videoItag: { type: integer, nullable: true }
    audioItag: { type: integer, nullable: true }
    audioTrackId: { type: string, nullable: true }
    subtitleMode:
      type: string
      enum: [deferred]
      nullable: true
      description: Omit to retain the contract v2 inline subtitle behavior.
AndroidPlaybackSeekRequest:
  type: object
  required: [generation, playerTimeMs]
  properties:
    generation: { type: integer, format: int64, minimum: 0 }
    playerTimeMs: { type: integer, format: int64, minimum: 0 }
AndroidPlaybackResponse:
  type: object
  required:
    - sessionId
    - videoId
    - manifestUrl
    - videoItag
    - audioItag
    - generation
    - ready
    - status
    - subtitles
  properties:
    sessionId: { type: string }
    videoId: { type: string }
    manifestUrl: { type: string }
    videoItag: { type: integer }
    audioItag: { type: integer }
    audioTrackId: { type: string, nullable: true }
    generation: { type: integer, format: int64, minimum: 0 }
    ready: { type: boolean }
    status: { type: string, enum: [ready, preparing] }
    subtitles:
      type: array
      items: { $ref: '#/AndroidSubtitle' }
    subtitleInventory:
      allOf:
        - $ref: '#/AndroidSubtitleInventoryReference'
      nullable: true
    retryAfterMs: { type: integer, format: int64, nullable: true, minimum: 100, maximum: 2000 }
AndroidSubtitle:
  type: object
  required: [id, mimeType, languageTag, displayLanguageName, isAutoGenerated, url]
  properties:
    id: { type: string }
    mimeType: { type: string, enum: [text/vtt] }
    languageTag: { type: string }
    displayLanguageName: { type: string }
    isAutoGenerated: { type: boolean }
    url:
      type: string
      description: Session-scoped same-origin resource that remains stable across playback generations.
AndroidSubtitleInventoryReference:
  type: object
  required: [status, url]
  properties:
    status: { type: string, enum: [preparing, ready, unavailable] }
    url:
      type: string
      description: Session-scoped same-origin inventory polling resource.
    retryAfterMs: { type: integer, format: int64, nullable: true, minimum: 100, maximum: 2000 }
AndroidSubtitleInventoryPreparingResponse:
  type: object
  required: [status, retryAfterMs]
  properties:
    status: { type: string, enum: [preparing] }
    retryAfterMs: { type: integer, format: int64, minimum: 100, maximum: 2000, example: 250 }
AndroidSubtitleInventoryReadyResponse:
  type: object
  required: [status, tracks]
  properties:
    status: { type: string, enum: [ready] }
    tracks:
      type: array
      items: { $ref: '#/AndroidSubtitle' }
