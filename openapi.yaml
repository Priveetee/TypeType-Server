openapi: 3.0.3
info:
  title: TypeType Server API
  version: 0.1.0
  description: Manual API contract for TypeType-Server. This file is maintained by hand and is not generated.
servers:
  - url: http://localhost:8080
    description: Local server
  - url: https://watch.eltux.fr/api
    description: Production frontend proxy
tags:
  - name: health
  - name: metadata
  - name: extraction
  - name: downloader
  - name: youtube-session
  - name: user-data
paths:
  /health: { $ref: ./openapi/paths/health.yaml#/Health }
  /instance: { $ref: ./openapi/paths/metadata.yaml#/Instance }
  /streams: { $ref: ./openapi/paths/streams.yaml#/Streams }
  /streams/audio-only: { $ref: ./openapi/paths/streams.yaml#/AudioOnly }
  /streams/audio-only/source: { $ref: ./openapi/paths/streams.yaml#/AudioOnlySource }
  /search: { $ref: ./openapi/paths/search.yaml#/Search }
  /search/filters: { $ref: ./openapi/paths/search.yaml#/SearchFilters }
  /channel: { $ref: ./openapi/paths/channel.yaml#/Channel }
  /channel/page: { $ref: ./openapi/paths/channel.yaml#/ChannelPage }
  /channel/playlists: { $ref: ./openapi/paths/channel.yaml#/ChannelPlaylists }
  /podcasts: { $ref: ./openapi/paths/podcasts.yaml#/Podcasts }
  /podcasts/episodes: { $ref: ./openapi/paths/podcasts.yaml#/PodcastEpisodes }
  /playlist: { $ref: ./openapi/paths/playlists.yaml#/Playlist }
  /saved-playlists: { $ref: ./openapi/paths/saved-playlists.yaml#/SavedPlaylists }
  /saved-playlists/{id}: { $ref: ./openapi/paths/saved-playlists.yaml#/SavedPlaylist }
  /settings: { $ref: ./openapi/paths/access-control.yaml#/Settings }
  /allowed/channels: { $ref: ./openapi/paths/access-control.yaml#/AllowedChannels }
  /allowed/channels/{channelUrl}: { $ref: ./openapi/paths/access-control.yaml#/AllowedChannel }
  /admin/settings: { $ref: ./openapi/paths/access-control.yaml#/AdminSettings }
  /admin/users: { $ref: ./openapi/paths/admin-users.yaml#/AdminUsers }
  /admin/users/{id}/access-mode: { $ref: ./openapi/paths/admin-users.yaml#/AdminUserAccessMode }
  /admin/users/managed-access: { $ref: ./openapi/paths/admin-managed-access.yaml#/AdminManagedAccessUsers }
  /admin/users/search: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminUsersSearch }
  /admin/users/{id}/allow-list: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminUserAllowList }
  /admin/users/{id}/allowed/channels: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminUserAllowedChannels }
  /admin/users/{id}/allowed/channels/{channelUrl}: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminUserAllowedChannel }
  /admin/allowed/playlists: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminAllowedPlaylists }
  /admin/allowed/playlists/{playlistUrl}: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminAllowedPlaylist }
  /admin/users/{id}/allowed/playlists: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminUserAllowedPlaylists }
  /admin/users/{id}/allowed/playlists/{playlistUrl}: { $ref: ./openapi/paths/admin-allow-list.yaml#/AdminUserAllowedPlaylist }
  /comments:
    $ref: ./openapi/paths/comments.yaml#/Comments
  /comments/replies:
    $ref: ./openapi/paths/comments.yaml#/Replies
  /downloader/health:
    $ref: ./openapi/paths/downloader.yaml#/Health
  /downloader/health/deep:
    $ref: ./openapi/paths/downloader.yaml#/DeepHealth
  /downloader/jobs:
    $ref: ./openapi/paths/downloader.yaml#/Jobs
  /downloader/jobs/{id}:
    $ref: ./openapi/paths/downloader.yaml#/Job
  /downloader/jobs/{id}/events:
    $ref: ./openapi/paths/downloader.yaml#/JobEvents
  /downloader/jobs/{id}/artifact:
    $ref: ./openapi/paths/downloader.yaml#/JobArtifact
  /downloader/jobs/{id}/cancel:
    $ref: ./openapi/paths/downloader.yaml#/JobCancel
  /youtube-session/browser/start:
    $ref: ./openapi/paths/youtube-session.yaml#/BrowserStart
  /youtube-session/browser/{sessionId}:
    $ref: ./openapi/paths/youtube-session.yaml#/BrowserSession
  /internal/youtube-remote-login/callback:
    $ref: ./openapi/paths/youtube-session.yaml#/InternalBrowserComplete
  /internal/youtube-session/browser/complete:
    $ref: ./openapi/paths/youtube-session.yaml#/InternalBrowserComplete
components:
  schemas:
    ErrorResponse:
      $ref: ./openapi/components/common.yaml#/ErrorResponse
    HealthResponse:
      $ref: ./openapi/components/common.yaml#/HealthResponse
    InstanceMinClientVersion:
      $ref: ./openapi/components/instance.yaml#/InstanceMinClientVersion
    InstanceResponse:
      $ref: ./openapi/components/instance.yaml#/InstanceResponse
    StreamResponse:
      $ref: ./openapi/components/streams.yaml#/StreamResponse
    AudioOnlyStreamResponse:
      $ref: ./openapi/components/streams.yaml#/AudioOnlyStreamResponse
    SearchPageResponse:
      $ref: ./openapi/components/media.yaml#/SearchPageResponse
    SearchFilterOption:
      $ref: ./openapi/components/media.yaml#/SearchFilterOption
    SearchFiltersResponse:
      $ref: ./openapi/components/media.yaml#/SearchFiltersResponse
    ChannelResultItem:
      $ref: ./openapi/components/media.yaml#/ChannelResultItem
    ChannelResponse:
      $ref: ./openapi/components/media.yaml#/ChannelResponse
    ChannelPageRequest:
      $ref: ./openapi/components/media.yaml#/ChannelPageRequest
    ChannelPlaylistsResponse:
      $ref: ./openapi/components/media.yaml#/ChannelPlaylistsResponse
    PlaylistResultItem:
      $ref: ./openapi/components/media.yaml#/PlaylistResultItem
    PodcastPageResponse:
      $ref: ./openapi/components/media.yaml#/PodcastPageResponse
    PodcastEpisodesResponse:
      $ref: ./openapi/components/media.yaml#/PodcastEpisodesResponse
    PublicPlaylistResponse:
      $ref: ./openapi/components/media.yaml#/PublicPlaylistResponse
    PublicPlaylistItem:
      $ref: ./openapi/components/media.yaml#/PublicPlaylistItem
    SavedPlaylistItem: { $ref: ./openapi/components/media.yaml#/SavedPlaylistItem }
    SavedPlaylistRequest: { $ref: ./openapi/components/media.yaml#/SavedPlaylistRequest }
    SettingsItem: { $ref: ./openapi/components/access-control.yaml#/SettingsItem }
    AdminSettingsItem: { $ref: ./openapi/components/access-control.yaml#/AdminSettingsItem }
    AllowedChannelItem: { $ref: ./openapi/components/access-control.yaml#/AllowedChannelItem }
    CommentsPageResponse: { $ref: ./openapi/components/media.yaml#/CommentsPageResponse }
    DownloadJob: { $ref: ./openapi/components/downloader.yaml#/DownloadJob }
    YoutubeRemoteBrowserStartRequest: { $ref: ./openapi/components/youtube-session.yaml#/YoutubeRemoteBrowserStartRequest }
    YoutubeRemoteBrowserStartResponse: { $ref: ./openapi/components/youtube-session.yaml#/YoutubeRemoteBrowserStartResponse }
    YoutubeRemoteBrowserCompleteRequest: { $ref: ./openapi/components/youtube-session.yaml#/YoutubeRemoteBrowserCompleteRequest }
